<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MICROJOY UNIVERSAL v2.3</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0c" id="metaThemeColor">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        /* ============== DARK THEME (DEFAULT) ============== */
        :root,
        :root[data-theme="dark"] {
            --bg-color: #08080a;
            --bg-grid: rgba(255, 255, 255, 0.02);
            --bg-radial: rgba(255, 51, 51, 0.05);
            --panel-bg: rgba(18, 18, 22, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --header-bg: rgba(10, 10, 12, 0.8);
            --row-bg: rgba(0, 0, 0, 0.2);
            --tx-bg: rgba(0, 230, 204, 0.05);
            --tx-border: rgba(0, 230, 204, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-bg-hover: rgba(255, 255, 255, 0.08);
            --select-bg: rgba(10, 10, 12, 0.8);
            --select-option-bg: #08080a;

            /* Controller body shades */
            --pad-body: #1a1a1f;
            --pad-body-2: #25252c;
            --pad-edge: #0a0a0c;
            --pad-stick: #15151a;
            --pad-stick-rim: rgba(255, 255, 255, 0.15);
            --pad-button-base: #2a2a32;
            --pad-button-rim: rgba(255, 255, 255, 0.1);
            --pad-shadow: rgba(0, 0, 0, 0.6);
            --pad-highlight: rgba(255, 255, 255, 0.06);

            --theme-red: #ff3333;
            --theme-red-dim: #4a0f0f;
            --theme-red-glow: rgba(255, 51, 51, 0.5);
            --text-main: #f0f0f0;
            --text-muted: #888899;
            --cyan-glow: #00e6cc;
            --cyan-shadow: rgba(0, 255, 204, 0.3);
            --success: #00ff66;
            --success-shadow: rgba(0, 255, 102, 0.4);

            /* Brand colors per profile */
            --ps-blue: #003791;
            --ps-light: #0070d1;
            --xbox-green: #107c10;
            --xbox-light: #9bf00b;
            --gen-amber: #ffaa00;

            --shadow-panel: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            --shadow-card: 0 8px 25px rgba(0, 0, 0, 0.4);
            --shadow-header: 0 4px 20px rgba(0, 0, 0, 0.5);
            --brand-text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            --toast-bg: rgba(20, 20, 25, 0.95);
        }

        /* ============== LIGHT THEME ============== */
        :root[data-theme="light"] {
            --bg-color: #f4f5f7;
            --bg-grid: rgba(0, 0, 0, 0.04);
            --bg-radial: rgba(255, 51, 51, 0.06);
            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(255, 255, 255, 0.85);
            --row-bg: rgba(0, 0, 0, 0.04);
            --tx-bg: rgba(0, 150, 130, 0.08);
            --tx-border: rgba(0, 150, 130, 0.2);
            --btn-bg: rgba(0, 0, 0, 0.04);
            --btn-bg-hover: rgba(0, 0, 0, 0.08);
            --select-bg: rgba(255, 255, 255, 0.9);
            --select-option-bg: #ffffff;

            /* Controller body — keep dark for contrast against light bg */
            --pad-body: #2a2c33;
            --pad-body-2: #3a3d45;
            --pad-edge: #1a1c22;
            --pad-stick: #1f2128;
            --pad-stick-rim: rgba(255, 255, 255, 0.2);
            --pad-button-base: #4a4d57;
            --pad-button-rim: rgba(255, 255, 255, 0.15);
            --pad-shadow: rgba(0, 0, 0, 0.25);
            --pad-highlight: rgba(255, 255, 255, 0.1);

            --theme-red: #d92020;
            --theme-red-dim: #fde0e0;
            --theme-red-glow: rgba(217, 32, 32, 0.35);
            --text-main: #15171a;
            --text-muted: #5a6270;
            --cyan-glow: #00897b;
            --cyan-shadow: rgba(0, 137, 123, 0.3);
            --success: #16a34a;
            --success-shadow: rgba(22, 163, 74, 0.35);

            --ps-blue: #003791;
            --ps-light: #0070d1;
            --xbox-green: #107c10;
            --xbox-light: #6fb800;
            --gen-amber: #d97706;

            --shadow-panel: 0 10px 30px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --shadow-card: 0 8px 25px rgba(0, 0, 0, 0.06);
            --shadow-header: 0 4px 20px rgba(0, 0, 0, 0.05);
            --brand-text-shadow: none;
            --toast-bg: rgba(255, 255, 255, 0.97);
        }

        * {
            box-sizing: border-box;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100dvh;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 50% 0%, var(--bg-radial) 0%, transparent 50%),
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- HEADER --- */
        .header {
            padding: 15px 25px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--panel-border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-header);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .brand-container { display: flex; flex-direction: column; }
        .brand-line {
            font-weight: bold; color: var(--text-main);
            letter-spacing: 2px; font-size: 1.2rem;
            text-shadow: var(--brand-text-shadow);
            display: flex; align-items: center; gap: 8px;
        }
        .brand-line::before {
            content: ''; display: inline-block; width: 8px; height: 8px; background: var(--theme-red);
            border-radius: 50%; box-shadow: 0 0 8px var(--theme-red);
        }
        .ver-tag { color: var(--theme-red); font-size: 0.75rem; margin-top: 4px; letter-spacing: 3px; }

        .header-controls { display: flex; gap: 10px; align-items: center; }

        .btn-icon {
            background: transparent; border: 1px solid var(--panel-border);
            color: var(--text-muted); padding: 8px 15px; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem;
        }
        .btn-icon:hover { background: var(--btn-bg-hover); color: var(--text-main); }
        .btn-icon:active { transform: scale(0.95); }

        #btnFullscreen, #btnTheme {
            padding: 8px 12px;
            font-size: 1.2rem;
            justify-content: center;
            min-width: 42px;
        }

        select.btn-icon {
            appearance: none;
            -webkit-appearance: none;
            background-color: var(--select-bg);
            outline: none;
        }
        select.btn-icon option {
            background-color: var(--select-option-bg);
            color: var(--text-main);
        }

        /* --- MAIN DASHBOARD --- */
        .dashboard {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 20px; gap: 20px;
            overflow-y: auto;
        }

        /* --- CONTROLLER VISUAL PANEL --- */
        .controller-panel {
            width: 100%; max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 20px;
            box-shadow: var(--shadow-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .ctl-header {
            color: var(--text-muted); font-size: 0.85rem;
            border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; margin-bottom: 15px;
            text-transform: uppercase; letter-spacing: 2px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .ctl-svg-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }
        /* ============= LINE-ART CONTROLLER STYLE ============= */
        /* All controller SVGs use stroke-only line drawings, no fills.
           This matches a technical blueprint aesthetic. */
        .ctl-svg-wrap svg {
            width: 100%;
            max-width: 460px;
            height: auto;
            stroke: var(--text-main);
            fill: none;
            stroke-linejoin: round;
            stroke-linecap: round;
        }
        /* Default outline weight */
        .ctl-svg-wrap svg .line-body { stroke-width: 1.6; fill: none; }
        .ctl-svg-wrap svg .line-mid  { stroke-width: 1.2; fill: none; }
        .ctl-svg-wrap svg .line-thin { stroke-width: 0.8; fill: none; opacity: 0.7; }
        .ctl-svg-wrap svg .line-fill { fill: var(--text-main); opacity: 0.04; stroke: none; }
        .ctl-svg-wrap svg text {
            stroke: none;
            fill: var(--text-muted);
            font-family: 'Share Tech Mono', monospace;
        }

        /* SVG element states - controlled via classes from JS */
        .pad-btn { transition: all 0.15s ease-out; }
        .pad-btn .btn-outline { stroke-width: 1.4; }
        .pad-btn .btn-glyph   { stroke-width: 1.4; }
        .pad-btn.pressed .btn-outline {
            stroke: currentColor;
            fill: currentColor;
            fill-opacity: 0.15;
            stroke-width: 2;
        }
        .pad-btn.pressed .btn-glyph {
            stroke: currentColor;
            fill: currentColor;
            stroke-width: 2;
            filter: drop-shadow(0 0 6px currentColor);
        }
        .pad-stick { transition: transform 0.04s linear; transform-origin: center; }
        .pad-dpad-arrow {
            transition: all 0.15s ease-out;
            stroke: var(--text-main);
            stroke-width: 1.4;
            fill: none;
        }
        .pad-dpad-arrow.pressed {
            stroke: var(--cyan-glow);
            fill: var(--cyan-glow);
            fill-opacity: 0.4;
            stroke-width: 2;
            filter: drop-shadow(0 0 5px var(--cyan-glow));
        }

        /* Per-button accent colors (used when pressed via currentColor) */
        .btn-cross    { color: #6dc2ff; }
        .btn-circle   { color: #ff5f5f; }
        .btn-square   { color: #ff7ee0; }
        .btn-triangle { color: #5cf2c5; }
        .btn-xbox-a   { color: #66cc33; }
        .btn-xbox-b   { color: #e62929; }
        .btn-xbox-x   { color: #2a8cf0; }
        .btn-xbox-y   { color: #ffcc00; }
        .btn-gen      { color: var(--gen-amber); }

        /* Mini telemetry strip below controller */
        .ctl-status-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--panel-border);
        }
        .strip-cell {
            background: var(--row-bg);
            border-radius: 6px;
            padding: 8px 6px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .strip-cell .strip-label {
            display: block;
            font-size: 0.6rem;
            opacity: 0.6;
            margin-bottom: 4px;
        }
        .strip-cell .strip-val {
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.85rem;
        }
        .strip-cell.active .strip-val {
            color: var(--theme-red);
            text-shadow: 0 0 8px var(--theme-red-glow);
        }

        /* Axis raw display */
        .axis-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }
        .axis-cell {
            flex: 1;
            background: var(--row-bg);
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .axis-cell .axis-val { color: var(--text-main); font-weight: bold; }
        .axis-cell .axis-val.val-active { color: var(--theme-red); text-shadow: 0 0 8px var(--theme-red-glow); }

        /* TX payload row */
        .tel-tx-row {
            background: var(--tx-bg); border: 1px solid var(--tx-border);
            padding: 12px 15px; border-radius: 8px; margin-top: 12px;
            font-size: 1rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;
            letter-spacing: 1px;
        }
        .tel-tx-val { color: var(--cyan-glow); text-shadow: 0 0 12px var(--cyan-shadow); font-weight: bold; }

        /* --- STATUS CLUSTER --- */
        .status-cluster { display: flex; width: 100%; max-width: 600px; gap: 15px; }

        .status-card {
            flex: 1; background: var(--panel-bg);
            border: 1px solid var(--panel-border); border-radius: 16px;
            padding: 18px 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            transition: all 0.3s ease; position: relative; overflow: hidden;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
        }
        .status-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--text-muted); transition: all 0.4s ease; opacity: 0.3;
        }
        .status-card.active { border-color: var(--theme-red-glow); }
        .status-card.active::before { background: var(--theme-red); opacity: 1; box-shadow: 0 0 15px var(--theme-red); }
        .status-card.active-success { border-color: var(--success-shadow); }
        .status-card.active-success::before { background: var(--success); opacity: 1; box-shadow: 0 0 15px var(--success); }

        .card-title { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 12px; text-align: center; }
        .card-indicator {
            font-size: 1rem; font-weight: bold; color: var(--text-muted); margin-bottom: 18px; text-align: center;
            letter-spacing: 1px; transition: color 0.3s;
        }
        .status-card.active .card-indicator { color: var(--theme-red); text-shadow: 0 0 10px var(--theme-red-glow); }
        .status-card.active-success .card-indicator { color: var(--success); text-shadow: 0 0 10px var(--success-shadow); }

        .btn-action {
            width: 100%; background: var(--btn-bg);
            color: var(--text-main); border: 1px solid var(--panel-border);
            padding: 12px 0; border-radius: 8px; font-size: 0.9rem;
            font-weight: bold; letter-spacing: 2px; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
        }
        .btn-action:hover { background: var(--btn-bg-hover); transform: translateY(-2px); }
        .btn-action:active { transform: translateY(1px); }
        .btn-red { border-color: var(--theme-red-glow); color: var(--theme-red); background: var(--theme-red-dim); }
        .btn-red:hover { background: var(--theme-red); color: #fff; box-shadow: 0 5px 15px var(--theme-red-glow); }

        .hint-text { font-size: 0.65rem; color: var(--text-muted); text-align: center; margin-top: 12px; letter-spacing: 1px; opacity: 0.7; }

        /* --- TOAST --- */
        .toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--toast-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-panel);
            z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s;
            opacity: 0;
            pointer-events: none;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { border-color: var(--success-shadow); color: var(--success); }
        .toast.error   { border-color: var(--theme-red-glow); color: var(--theme-red); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .anim-pulse { animation: pulse 2s infinite; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .ctl-svg-wrap svg { animation: fadeIn 0.35s ease-out; }

        @media (orientation: landscape) and (min-height: 400px) {
            .dashboard { flex-direction: row; justify-content: center; align-items: stretch; }
            .controller-panel { flex: 1.6; margin-bottom: 0; }
            .status-cluster { flex: 1; flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-container">
            <div class="brand-line">MICROJOY UNIVERSAL</div>
            <div class="ver-tag">SYSTEM v2.3 // ALIMIN</div>
        </div>
        <div class="header-controls">
            <select id="controllerType" class="btn-icon" aria-label="Controller Type">
                <option value="ps4">🎮 PS4/DSense</option>
                <option value="xbox">🎮 Xbox</option>
                <option value="generic">🎮 Generic</option>
            </select>
            <button class="btn-icon" id="btnTheme" aria-label="Toggle Theme" title="Toggle Light/Dark">🌙</button>
            <button class="btn-icon" id="btnFullscreen" aria-label="Fullscreen" title="Toggle Fullscreen">⛶</button>
        </div>
    </div>

    <div class="dashboard">

        <div class="controller-panel">
            <div class="ctl-header">
                <span id="ctlHeaderTitle">PLAYSTATION CONTROLLER</span>
                <span>LIVE</span>
            </div>

            <div class="ctl-svg-wrap" id="ctlSvgWrap">
                <!-- SVG injected by JS -->
            </div>

            <div class="axis-row">
                <div class="axis-cell"><span>AXIS-X</span><span class="axis-val" id="psX">0.00</span></div>
                <div class="axis-cell"><span>AXIS-Y</span><span class="axis-val" id="psY">0.00</span></div>
            </div>

            <div class="ctl-status-strip">
                <div class="strip-cell" id="cellDpad">
                    <span class="strip-label">D-PAD</span>
                    <span class="strip-val" id="psDpad">IDLE</span>
                </div>
                <div class="strip-cell" id="cellBtn0">
                    <span class="strip-label" id="lblBtn0">A</span>
                    <span class="strip-val" id="psCross">OFF</span>
                </div>
                <div class="strip-cell" id="cellBtn1">
                    <span class="strip-label" id="lblBtn1">B</span>
                    <span class="strip-val" id="psCircle">OFF</span>
                </div>
                <div class="strip-cell" id="cellBtn2">
                    <span class="strip-label" id="lblBtn2">C</span>
                    <span class="strip-val" id="psSquare">OFF</span>
                </div>
            </div>
            <div class="ctl-status-strip" style="grid-template-columns: 1fr; margin-top:8px; padding-top:8px;">
                <div class="strip-cell" id="cellBtn3">
                    <span class="strip-label" id="lblBtn3">D</span>
                    <span class="strip-val" id="psTriangle">OFF</span>
                </div>
            </div>

            <div class="tel-tx-row">
                <span>TX_OUT:</span><span class="tel-tx-val anim-pulse" id="telemetryOut">AWAITING</span>
            </div>
        </div>

        <div class="status-cluster">
            <div class="status-card" id="dsCard">
                <div class="card-title" id="controllerTitle">PLAYSTATION CONTROLLER</div>
                <div class="card-indicator anim-pulse" id="dsStatus">AWAITING PAIR</div>
                <button class="btn-action" id="btnCalibrate">CALIBRATE</button>
                <div class="hint-text">Press Start/PS Button to Connect</div>
            </div>

            <div class="status-card" id="botCard">
                <div class="card-title">MICRO:BIT LINK</div>
                <div class="card-indicator anim-pulse" id="botStatus">OFFLINE</div>
                <button class="btn-action btn-red" id="btnConnect">LINK BLE</button>
                <div class="hint-text">Wake Lock Enabled</div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        'use strict';

        // ====================================================================
        // SVG CONTROLLER LAYOUTS — one per profile
        // Each layout exposes the same set of IDs so JS can drive states uniformly:
        //   #svgStick, #svgBtn0, #svgBtn1, #svgBtn2, #svgBtn3,
        //   #svgDpadUp, #svgDpadDown, #svgDpadLeft, #svgDpadRight
        // ====================================================================
        // ============================================================
        // SVG layouts — viewBox 480x320, geometry calibrated so that
        // body, d-pad, face buttons, sticks, and accents NEVER overlap.
        //
        // Reference layout zones (real controllers):
        //   PS4    : DPad TL, FaceBtns TR, LStick BL, RStick BR, touchpad center-top
        //   Xbox   : LStick TL, FaceBtns TR, DPad BL, RStick BR, guide center-top
        //   Generic: LStick L (big), DPad TR, FaceBtns BR, display center-bottom
        // ============================================================
        const SVG_LAYOUTS = {
            // ============================================================
            // PS4 / DualShock 4 — line-art style
            // Reference: dual rounded grip lobes, central touchpad,
            // D-pad TL, face buttons TR (diamond), dual sticks bottom
            // (sebaris bersilang), PS logo between sticks, SHARE/OPTIONS
            // micro-tabs flanking the touchpad.
            // ============================================================
            ps4: `
<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg">

  <!-- L1 / R1 shoulder bumpers (peek above body) -->
  <path class="line-body" d="M 90 60 Q 80 50 110 50 L 175 50 Q 200 50 195 70 Q 175 70 165 75 Q 130 75 105 75 Q 90 75 90 60 Z"/>
  <path class="line-body" d="M 430 60 Q 440 50 410 50 L 345 50 Q 320 50 325 70 Q 345 70 355 75 Q 390 75 415 75 Q 430 75 430 60 Z"/>
  <text x="125" y="68" font-size="9" text-anchor="middle">L1</text>
  <text x="395" y="68" font-size="9" text-anchor="middle">R1</text>

  <!--
    DualShock 4 body — two big rounded grip lobes connected by a flatter
    middle bridge. Top has a slight dip for the lightbar.
  -->
  <path class="line-body" d="
    M 110 80
    C 75 78, 45 95, 38 140
    C 32 195, 55 250, 100 270
    C 135 285, 170 270, 190 250
    C 205 235, 220 228, 240 228
    L 280 228
    C 300 228, 315 235, 330 250
    C 350 270, 385 285, 420 270
    C 465 250, 488 195, 482 140
    C 475 95, 445 78, 410 80

        // ====================================================================
        // PWA REGISTRATION
        // ====================================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }

        // ====================================================================
        // TOAST
        // ====================================================================
        const toastEl = document.getElementById('toast');
        let toastTimer = null;
        function showToast(msg, type = 'info', duration = 2400) {
            toastEl.textContent = msg;
            toastEl.className = 'toast show' + (type !== 'info' ? ' ' + type : '');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        // ====================================================================
        // THEME
        // ====================================================================
        const btnTheme = document.getElementById('btnTheme');
        const metaThemeColor = document.getElementById('metaThemeColor');
        const THEME_KEY = 'microjoy-theme';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            btnTheme.textContent = theme === 'dark' ? '🌙' : '☀️';
            btnTheme.title = theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#0a0a0c' : '#f4f5f7');
            try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
        }
        (function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
            if (saved === 'light' || saved === 'dark') applyTheme(saved);
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light');
            else applyTheme('dark');
        })();
        btnTheme.addEventListener('click', () => {
            const c = document.documentElement.getAttribute('data-theme');
            applyTheme(c === 'dark' ? 'light' : 'dark');
        });

        // ====================================================================
        // CONTROLLER PROFILE & SVG SWAPPING

        const lblBtn0 = document.getElementById('lblBtn0');

        const lblBtn2 = document.getElementById('lblBtn2');
        const lblBtn3 = document.getElementById('lblBtn3');
        const controllerTitle = document.getElementById('controllerTitle');
        const ctlHeaderTitle = document.getElementById('ctlHeaderTitle');
        const dsStatusEl = document.getElementById('dsStatus');
        const ctlSvgWrap = document.getElementById('ctlSvgWrap');

        const controllerProfiles = {
            ps4: {
                title: "PLAYSTATION CONTROLLER",
                btn0: "✕ CROSS", btn1: "◯ CIRCLE", btn2: "□ SQUARE", btn3: "△ TRIANGLE"

                btn0: "BTN 0", btn1: "BTN 1", btn2: "BTN 2", btn3: "BTN 3"

        let svgStick, svgBtn0, svgBtn1, svgBtn2, svgBtn3;
        let svgDpadUp, svgDpadDown, svgDpadLeft, svgDpadRight;

        function bindSvgRefs() {
            svgStick     = document.getElementById('svgStick');
            svgBtn0      = document.getElementById('svgBtn0');
            svgBtn1      = document.getElementById('svgBtn1');
            svgBtn2      = document.getElementById('svgBtn2');
            svgBtn3      = document.getElementById('svgBtn3');
            svgDpadUp    = document.getElementById('svgDpadUp');
            svgDpadDown  = document.getElementById('svgDpadDown');
            svgDpadLeft  = document.getElementById('svgDpadLeft');
            svgDpadRight = document.getElementById('svgDpadRight');
        }

        // Stick origin (per profile, must match transform="translate(X, Y)" in SVG above)
        // These MUST match transform="translate(X,Y)" on each #svgStick group above
        const STICK_ORIGINS = {
            ps4:     { x: 195, y: 220 },
            xbox:    { x: 135, y: 175 },
            generic: { x: 195, y: 200 }
        };
        const STICK_RADIUS = 14;

        function applyProfile(key) {
            const profile = controllerProfiles[key];
            ctlSvgWrap.innerHTML = SVG_LAYOUTS[key];
            bindSvgRefs();

            controllerTitle.textContent = profile.title;
            ctlHeaderTitle.textContent = profile.title;
            lblBtn0.textContent = profile.btn0;
            lblBtn1.textContent = profile.btn1;
            lblBtn2.textContent = profile.btn2;
            lblBtn3.textContent = profile.btn3;

            // Reset stick visual to center
            updateStickVisual(0, 0);

            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (!pads[0]) dsStatusEl.textContent = "AWAITING PAIR";
        }

        controllerType.addEventListener('change', (e) => applyProfile(e.target.value));

        function currentProfileKey() {
            return controllerType.value;
        }

        function updateStickVisual(ax, ay) {
            if (!svgStick) return;
            const origin = STICK_ORIGINS[currentProfileKey()];
            const dx = ax * STICK_RADIUS;
            const dy = ay * STICK_RADIUS;
            svgStick.setAttribute('transform', `translate(${origin.x + dx}, ${origin.y + dy})`);
        }

        // Initial mount
        applyProfile('ps4');

        // ====================================================================
        const btnFullscreen = document.getElementById('btnFullscreen');
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.warn(err.message));
                }
            } else if (document.exitFullscreen) {

        // WAKE LOCK
        // ====================================================================
        let wakeLock = null;
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            if (wakeLock) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {
                console.warn(`Wake Lock Error: ${err.name}, ${err.message}`);
            }
        }
        document.addEventListener('click', () => { requestWakeLock(); }, { once: true });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        // ====================================================================
        // BLE CORE
        // ====================================================================
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        let bleDevice = null, rxChar = null;
        let cX = 0, cY = 0, lX = 0, lY = 0;

        const botCard = document.getElementById('botCard');
        const botStatusEl = document.getElementById('botStatus');
        const telEl = document.getElementById('telemetryOut');
        const connBtn = document.getElementById('btnConnect');

        function onDisconnected() {
            botStatusEl.textContent = "OFFLINE";
            botStatusEl.classList.add('anim-pulse');
            botCard.classList.remove('active-success');
            connBtn.textContent = "LINK BLE";
            connBtn.classList.add('btn-red');
            telEl.textContent = "SEVERED";
            telEl.classList.add('anim-pulse');
            rxChar = null;
            showToast('Micro:bit disconnected', 'error');
        }

        connBtn.addEventListener('click', async () => {
            requestWakeLock();
            if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
                try { bleDevice.gatt.disconnect(); } catch (e) { console.warn(e); }
                return;
            }
            if (!navigator.bluetooth) {
                showToast('Web Bluetooth tidak disokong di browser ini', 'error', 3500);
                return;
            }
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC" }, { namePrefix: "micro:bit" }],
                    optionalServices: [UART_SERVICE_UUID]
                });
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server  = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxChar = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                botStatusEl.textContent = "LINK ESTABLISHED";
                botStatusEl.classList.remove('anim-pulse');
                botCard.classList.add('active-success');
                connBtn.textContent = "SEVER CONNECTION";
                connBtn.classList.remove('btn-red');
                telEl.classList.remove('anim-pulse');
                showToast('Micro:bit connected', 'success');
                await send("mode_analog\n");
            } catch (e) {
                console.error("BLE Error:", e);
                if (e && e.name !== 'NotFoundError') {
                    showToast('Sambungan gagal: ' + (e.message || e.name), 'error', 3000);
                }
            }
        });

        let isSending = false;
        async function send(s) {
            telEl.textContent = `${s.replace('\n', '')}`;
            if (!rxChar || isSending) return;
            isSending = true;
            try {
                const data = new TextEncoder().encode(s);
                if (rxChar.properties && rxChar.properties.writeWithoutResponse) {
                    await rxChar.writeValueWithoutResponse(data);
                } else {
                    await rxChar.writeValue(data);
                }
            } catch (e) {
                console.warn("Kesesakan BLE, packet digugurkan:", e);
            } finally {
                isSending = false;
            }
        }

        const fFormat = (v) => (v >= 0 ? '+' : '-') + Math.abs(v).toString().padStart(2, '0');

        // ====================================================================
        // GAMEPAD POLLING
        // ====================================================================
        const dsCard = document.getElementById('dsCard');
        const btnCalibrate = document.getElementById('btnCalibrate');

        const outPsX = document.getElementById('psX');
        const outPsY = document.getElementById('psY');
        const outPsDpad = document.getElementById('psDpad');
        const outPsCross = document.getElementById('psCross');
        const outPsCircle = document.getElementById('psCircle');
        const outPsSquare = document.getElementById('psSquare');
        const outPsTriangle = document.getElementById('psTriangle');

        const cellDpad = document.getElementById('cellDpad');
        const cellBtn0 = document.getElementById('cellBtn0');
        const cellBtn1 = document.getElementById('cellBtn1');
        const cellBtn2 = document.getElementById('cellBtn2');
        const cellBtn3 = document.getElementById('cellBtn3');

        let gpState = { cross: false, circle: false, square: false, triangle: false };
        const GP_DEADZONE = 0.15;

        let offsetX = 0;
        let offsetY = 0;
        let lastSendTime = 0;
        const SEND_INTERVAL = 40;

        btnCalibrate.addEventListener('click', () => {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];
            if (gp) {
                offsetX = gp.axes[0];
                offsetY = gp.axes[1];
                showToast('Joystick dikalibrasi — titik tengah baru ditetapkan', 'success');
            } else {
                showToast('Sila sambungkan controller terlebih dahulu', 'error');
            }
        });

        window.addEventListener("gamepadconnected", () => {
            dsStatusEl.textContent = "CONTROLLER ACQUIRED";
            dsStatusEl.classList.remove('anim-pulse');
            dsCard.classList.add('active');
            showToast('Controller acquired', 'success');
        });

        window.addEventListener("gamepaddisconnected", () => {
            dsStatusEl.textContent = "AWAITING PAIR";
            dsStatusEl.classList.add('anim-pulse');
            dsCard.classList.remove('active');
            outPsX.textContent = "0.00"; outPsY.textContent = "0.00";
            outPsDpad.textContent = "IDLE";
            outPsCross.textContent = "OFF"; outPsCircle.textContent = "OFF";
            outPsSquare.textContent = "OFF"; outPsTriangle.textContent = "OFF";
            [outPsX, outPsY].forEach(el => el.classList.remove('val-active'));
            [cellDpad, cellBtn0, cellBtn1, cellBtn2, cellBtn3].forEach(el => el.classList.remove('active'));
            // Reset SVG visuals
            updateStickVisual(0, 0);
            [svgBtn0, svgBtn1, svgBtn2, svgBtn3].forEach(el => el && el.classList.remove('pressed'));
            [svgDpadUp, svgDpadDown, svgDpadLeft, svgDpadRight].forEach(el => el && el.classList.remove('pressed'));
            cX = 0; cY = 0; offsetX = 0; offsetY = 0;
            lX = 999; lY = 999;
            send("X+00,Y+00\n");
        });

        function setStripState(cell, valEl, isPressed, labelOn = "ON", labelOff = "OFF") {
            valEl.textContent = isPressed ? labelOn : labelOff;
            if (isPressed) cell.classList.add('active');
            else cell.classList.remove('active');
        }

        function setSvgPressed(svgEl, isPressed) {
            if (!svgEl) return;
            if (isPressed) svgEl.classList.add('pressed');
            else svgEl.classList.remove('pressed');
        }

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];

            if (gp) {
                let ax = gp.axes[0] - offsetX;
                let ay = gp.axes[1] - offsetY;
                ax = Math.max(-1, Math.min(1, ax));
                ay = Math.max(-1, Math.min(1, ay));

                outPsX.textContent = ax.toFixed(2);
                outPsY.textContent = ay.toFixed(2);
                if (Math.abs(ax) > GP_DEADZONE || Math.abs(ay) > GP_DEADZONE) {
                    outPsX.classList.add('val-active'); outPsY.classList.add('val-active');
                } else {
                    outPsX.classList.remove('val-active'); outPsY.classList.remove('val-active');
                }

                // Visual stick movement (uses raw axis, not deadzoned, so it feels responsive)
                updateStickVisual(ax, ay);

                if (Math.abs(ax) < GP_DEADZONE) ax = 0;
                if (Math.abs(ay) < GP_DEADZONE) ay = 0;

                // D-pad
                const upPressed    = !!(gp.buttons[12] && gp.buttons[12].pressed);
                const downPressed  = !!(gp.buttons[13] && gp.buttons[13].pressed);
                const leftPressed  = !!(gp.buttons[14] && gp.buttons[14].pressed);
                const rightPressed = !!(gp.buttons[15] && gp.buttons[15].pressed);

                setSvgPressed(svgDpadUp,    upPressed);
                setSvgPressed(svgDpadDown,  downPressed);
                setSvgPressed(svgDpadLeft,  leftPressed);
                setSvgPressed(svgDpadRight, rightPressed);

                let dpadActive = false; let dpX = 0; let dpY = 0;
                if (downPressed)  { dpY =  90; dpadActive = true; }
                if (upPressed)    { dpY = -90; dpadActive = true; }
                if (leftPressed)  { dpX = -90; dpadActive = true; }
                if (rightPressed) { dpX =  90; dpadActive = true; }

                if (dpadActive) {
                    cX = dpX; cY = dpY;
                    setStripState(cellDpad, outPsDpad, true, "ACTIVE");
                } else {
                    cX = Math.round(ax * 90);
                    cY = Math.round(-ay * 90);
                    setStripState(cellDpad, outPsDpad, false, "ON", "IDLE");
                }

                const now = Date.now();
                const isReturnToZero = (cX === 0 && cY === 0 && (lX !== 0 || lY !== 0));
                if ((cX !== lX || cY !== lY) && (isReturnToZero || (now - lastSendTime > SEND_INTERVAL))) {
                    send(`X${fFormat(cX)},Y${fFormat(cY)}\n`);
                    lX = cX; lY = cY; lastSendTime = now;
                }

                // BUTTONS
                if (gp.buttons[0] && gp.buttons[0].pressed && !gpState.cross) {
                    gpState.cross = true; setStripState(cellBtn0, outPsCross, true); setSvgPressed(svgBtn0, true); send("A\n");
                } else if (gp.buttons[0] && !gp.buttons[0].pressed && gpState.cross) {
                    gpState.cross = false; setStripState(cellBtn0, outPsCross, false); setSvgPressed(svgBtn0, false); send("a\n");
                }
                if (gp.buttons[1] && gp.buttons[1].pressed && !gpState.circle) {
                    gpState.circle = true; setStripState(cellBtn1, outPsCircle, true); setSvgPressed(svgBtn1, true); send("B\n");
                } else if (gp.buttons[1] && !gp.buttons[1].pressed && gpState.circle) {
                    gpState.circle = false; setStripState(cellBtn1, outPsCircle, false); setSvgPressed(svgBtn1, false); send("b\n");
                }
                if (gp.buttons[2] && gp.buttons[2].pressed && !gpState.square) {
                    gpState.square = true; setStripState(cellBtn2, outPsSquare, true); setSvgPressed(svgBtn2, true); send("C\n");
                } else if (gp.buttons[2] && !gp.buttons[2].pressed && gpState.square) {
                    gpState.square = false; setStripState(cellBtn2, outPsSquare, false); setSvgPressed(svgBtn2, false); send("c\n");
                }
                if (gp.buttons[3] && gp.buttons[3].pressed && !gpState.triangle) {
                    gpState.triangle = true; setStripState(cellBtn3, outPsTriangle, true); setSvgPressed(svgBtn3, true); send("D\n");
                } else if (gp.buttons[3] && !gp.buttons[3].pressed && gpState.triangle) {
                    gpState.triangle = false; setStripState(cellBtn3, outPsTriangle, false); setSvgPressed(svgBtn3, false); send("d\n");
                }
            }
            requestAnimationFrame(pollGamepad);
        }

        pollGamepad();
    </script>
</body>
</html>
